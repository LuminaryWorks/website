name: Deploy site to Cloudflare Pages

# Production: https://luminaryworks-website.pages.dev (no branch prefix)
# Custom domain: luminaryworks.dev
#
# Secrets (org or repo — org-level is enough if granted to this repo):
#   CLOUDFLARE_API_TOKEN  — Account · Cloudflare Pages · Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-luminaryworks-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (org or repo secret). Grant the org secret to LuminaryWorks/website at https://github.com/organizations/LuminaryWorks/settings/secrets/actions"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID (org or repo secret)."
            missing=1
          fi
          exit $missing

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NODE_ENV: production

      # No --branch: production deploy → luminaryworks-website.pages.dev (not main.luminaryworks-website.pages.dev)
      # Use npx (not wrangler-action) to avoid npm install into a pnpm workspace.
      - name: Publish to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=luminaryworks-website
